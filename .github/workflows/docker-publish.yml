name: Publish Docker images

on:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            repository: blog-platform-backend
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            repository: blog-platform-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: luf23
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: luf23/${{ matrix.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  release:
    name: Check for a merged dev pull request
    needs: publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.pull-request.outputs.result }}
    steps:
      - name: Check the pull request associated with this commit
        id: pull-request
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { ...context.repo, commit_sha: context.sha, per_page: 100 }
            );
            return pullRequests.some(pr =>
              pr.merged_at !== null &&
              pr.merge_commit_sha === context.sha &&
              pr.head.ref === 'dev' &&
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              pr.base.ref === context.ref.replace('refs/heads/', '')
            );

  deploy:
    name: Deploy merged dev changes
    needs: release
    if: needs.release.outputs.deploy == 'true'
    uses: ./.github/workflows/cd.yml
    secrets: inherit
